name: Testing

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENBSD_VERSIONS: '7.9'
  OPENBSD_ARCHITECTURES: 'x86-64'

jobs:
  changed:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      ports: ${{ steps.matrix.outputs.ports }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine changed ports
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: bash .github/scripts/changed-ports.sh

      - name: Build build matrix
        id: matrix
        shell: bash
        env:
          VERSIONS: ${{ env.OPENBSD_VERSIONS }}
          ARCHITECTURES: ${{ env.OPENBSD_ARCHITECTURES }}
        run: bash .github/scripts/build-matrix.sh

  build:
    needs: changed
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changed.outputs.matrix) }}
    defaults:
      run:
        shell: cpa.sh {0}

    steps:
      - if: matrix.version != ''
        uses: actions/checkout@v6

      - if: matrix.version != ''
        name: Prepare changed ports
        shell: bash
        env:
          PORTS: ${{ needs.changed.outputs.ports }}
          PORT_PACKAGES: ${{ env.PORT_PACKAGES }}
        run: |
          printf '%s\n' "$PORTS" \
            | jq -r --argjson pkgs "$PORT_PACKAGES" \
                '.[] | [., ($pkgs[.] // "")] | @tsv' \
            > changed-ports.txt

      - if: matrix.version != ''
        name: Start OpenBSD VM
        uses: cross-platform-actions/action@v1.6.0
        with:
          operating_system: openbsd
          version: ${{ matrix.version }}
          architecture: ${{ matrix.architecture }}
          shell: bash
          memory: 4G
          cpu_count: 4

      - if: matrix.version != ''
        name: Set up ports tree
        run: bash .github/scripts/setup-ports.sh "${{ matrix.version }}"

      - if: matrix.version != ''
        name: Build ports
        run: bash .github/scripts/build-ports.sh

      - if: always() && matrix.version != ''
        name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.version }}-${{ matrix.architecture }}
          path: ci-packages/**
          if-no-files-found: ignore

      - if: always() && matrix.version != ''
        name: Upload build logs
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.version }}-${{ matrix.architecture }}
          path: ci-logs/
          if-no-files-found: ignore
