name: Testing

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENBSD_VERSIONS: '7.9'
  OPENBSD_ARCHITECTURES: 'x86-64'
  # Extra packages needed to build specific ports, keyed by <category>/<port>.
  # They are expanded into changed-ports.txt (port<TAB>packages) and installed
  # by build-ports.sh right before that port is built, so unrelated ports do
  # not pull in anything extra.
  PORT_PACKAGES: '{"productivity/pimsync": "rust cargo-generate-vendor sqlite3", "games/openage": "eigen3 qt6-qtbase qt6-qtdeclarative qt6-qtmultimedia harfbuzz opus opusfile libogg png py3-cython py3-setuptools py3-mako py3-pygments py3-numpy py3-Pillow py3-lz4 py3-tomli_w", "devel/klee": "llvm%19 z3 sqlite3 py3-tabulate"}'

jobs:
  changed:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      ports: ${{ steps.matrix.outputs.ports }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine changed ports
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: bash .github/scripts/changed-ports.sh

      - name: Build build matrix
        id: matrix
        shell: bash
        env:
          VERSIONS: ${{ env.OPENBSD_VERSIONS }}
          ARCHITECTURES: ${{ env.OPENBSD_ARCHITECTURES }}
        run: bash .github/scripts/build-matrix.sh

  build:
    needs: changed
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changed.outputs.matrix) }}
    defaults:
      run:
        shell: cpa.sh {0}

    steps:
      - if: matrix.version != ''
        uses: actions/checkout@v7

      - if: matrix.version != ''
        name: Prepare changed ports
        shell: bash
        env:
          PORTS: ${{ needs.changed.outputs.ports }}
          PORT_PACKAGES: ${{ env.PORT_PACKAGES }}
        run: |
          printf '%s\n' "$PORTS" \
            | jq -r --argjson pkgs "$PORT_PACKAGES" \
                '.[] | [., ($pkgs[.] // "")] | @tsv' \
            > changed-ports.txt

      - if: matrix.version != ''
        name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ci-cache
          key: ccache-${{ matrix.version }}-${{ matrix.architecture }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.version }}-${{ matrix.architecture }}-

      - if: matrix.version != ''
        name: Restore ports tarball
        uses: actions/cache@v6
        with:
          path: ci-src
          key: ports-src-${{ matrix.version }}-${{ matrix.architecture }}

      - if: matrix.version != ''
        name: Start OpenBSD VM
        uses: cross-platform-actions/action@v1.6.0
        with:
          operating_system: openbsd
          version: ${{ matrix.version }}
          architecture: ${{ matrix.architecture }}
          shell: bash
          memory: 4G
          cpu_count: 4

      - if: matrix.version != ''
        name: Set up ports tree
        shell: cpa.sh {0} --sync-files runner-to-vm
        run: bash .github/scripts/setup-ports.sh "${{ matrix.version }}"

      - if: matrix.version != ''
        name: Build ports
        shell: cpa.sh {0} --sync-files runner-to-vm
        run: bash .github/scripts/build-ports.sh

      # The build steps sync into the VM only, so pull the results (packages,
      # logs and the updated ccache) back before they are used or cached.
      - if: always() && matrix.version != ''
        name: Sync VM files back
        shell: bash
        run: cpa.sh --sync-files vm-to-runner

      - if: always() && matrix.version != ''
        name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.version }}-${{ matrix.architecture }}
          path: ci-packages/**
          if-no-files-found: ignore

      - if: always() && matrix.version != ''
        name: Upload build logs
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.version }}-${{ matrix.architecture }}
          path: ci-logs/
          if-no-files-found: ignore
